server:
  host: "0.0.0.0"
  port: 9090
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 5s

rate_limit:
  enabled: true
  default_rate: 50
  default_burst: 100
  key_by: "ip"
  cleanup_interval: 30s

jwt:
  enabled: true
  secret: "test-secret-key"
  algorithm: "HS256"
  claims:
    required:
      - "sub"
      - "exp"
    issuer_allowlist:
      - "test-issuer"
    audience_allowlist:
      - "test-audience"

routes:
  - name: "test-service"
    method: "GET"
    path:
      type: "prefix"
      value: "/api/v1/test/"
    backends:
      - url: "http://localhost:9001"
        weight: 1
    lb_strategy: "round_robin"
    timeout: 5s

logging:
  level: "debug"
  format: "text"
  log_body: false
